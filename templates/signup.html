{% extends "base.html" %}

{% block extra_css %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/signup.css') }}">
{% endblock %}

{% block content %}
<div class="auth-card">
  <h2 style="font-size: 1.8rem; font-weight: 800; color: #D63384; margin-bottom: 6px;">Join MemoryVerse 🌸</h2>
  <p style="color: var(--text-muted); margin-bottom: 20px;">Start saving your precious moments today ✨</p>

  <form method="POST" action="{{ url_for('signup') }}">
    <div class="form-group">
      <label class="form-label">Your Name</label>
      <input type="text" name="full_name" class="form-input" placeholder="e.g. Shreya Sharma" required>
    </div>

    <div class="form-group">
      <label class="form-label">Email Address</label>
      <input type="email" name="email" class="form-input" placeholder="shreya@example.com" required>
    </div>

    <div class="form-group">
      <label class="form-label">Choose Avatar</label>
      <div class="avatar-select-grid">
        <span class="avatar-opt selected" onclick="selectAvatar(this, 'bunny.png')">🐰</span>
        <span class="avatar-opt" onclick="selectAvatar(this, 'cat.png')">🐱</span>
        <span class="avatar-opt" onclick="selectAvatar(this, 'bear.png')">🐻</span>
        <span class="avatar-opt" onclick="selectAvatar(this, 'panda.png')">🐼</span>
      </div>
      <input type="hidden" name="avatar" id="avatarInput" value="bunny.png">
    </div>

    <div class="form-group">
      <label class="form-label">Password</label>
      <input type="password" name="password" class="form-input" placeholder="••••••••" required>
    </div>

    <div class="form-group">
      <label class="form-label">Confirm Password</label>
      <input type="password" name="confirm_password" class="form-input" placeholder="••••••••" required>
    </div>

    <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 10px;">Sign Up ✨</button>
  </form>

  <p style="margin-top: 20px; font-size: 0.9rem;">
    Already have an account? <a href="{{ url_for('login') }}" style="color: #D63384; font-weight: 700;">Sign in</a> 🌸
  </p>
</div>
{% endblock %}

{% block extra_js %}
<script src="{{ url_for('static', filename='js/profile.js') }}"></script>
{% endblock %}
