{% extends "base.html" %}

{% block css %}
<link rel="stylesheet"
href="{{ url_for('static', filename='css/scrapbook_editor.css') }}">
{% endblock %}

{% block content %}

<div class="editor-page">

    <!-- ===========================
         Header
    ============================ -->

    <div class="editor-header">

        <a href="/scrapbook" class="back-btn">
            ←
        </a>

        <h2>{{ title }}</h2>

        <button
        id="saveScrapbook"
        class="save-btn">

            💚 Save

        </button>

    </div>

    <!-- ===========================
         Toolbar
    ============================ -->

    <div class="toolbar">

        <button onclick="openBackgrounds()">
            🖼️
            <span>Background</span>
        </button>

        <button onclick="openPhotos()">
            📷
            <span>Photos</span>
        </button>

        <button onclick="openStickers()">
            🌸
            <span>Sticker</span>
        </button>

        <button onclick="openFrames()">
            🖼️
            <span>Frame</span>
        </button>

        <button onclick="openPapers()">
            📜
            <span>Paper</span>
        </button>

        <button onclick="openTapes()">
            🎀
            <span>Tape</span>
        </button>

        <button onclick="addText()">
            ✏️
            <span>Text</span>
        </button>

    </div>

    <!-- ===========================
         Canvas
    ============================ -->

    <div

        id="canvas"

        class="canvas"

        {% if background %}

        style="background-image:url('{{ background }}')"

        {% endif %}

    >

        <!-- Cover Banner -->

        {% if cover %}

        <div class="cover-container">

            <img

            id="coverPhoto"

            class="cover-photo"

            src="{{ url_for(
            'static',
            filename='uploads/scrapbook/' ~ cover
            ) }}">

        </div>
        

        {% endif %}
        <!-- ===========================
             Placeholder
        ============================ -->

        <div class="canvas-placeholder">

            <div class="placeholder-icon">
                ✨
            </div>

            <h3>
                Start Creating
            </h3>

            <p>
                Add photos, stickers, papers and memories.
            </p>

        </div>

        <!-- Dynamic scrapbook items -->
        <div id="canvasItems"></div>

    </div>

</div>

<!-- ===========================
     Bottom Panel
=========================== -->

<div
id="bottomPanel"
class="bottom-panel">

    <div class="panel-header">

        <h3 id="panelTitle">
            Choose Item
        </h3>

        <button
        class="close-btn"
        onclick="closePanel()">

            ✖

        </button>

    </div>

    <div
    id="assetContainer"
    class="asset-grid">

    </div>

</div>

<!-- ===========================
     Hidden File Picker
=========================== -->

<input

type="file"

id="photoPicker"

accept="image/*"

hidden

onchange="uploadPhoto(event)">

{% endblock %}

{% block js %}

<script src="{{ url_for('static',
filename='js/scrapbook_editor.js') }}"></script>

{% endblock %}
