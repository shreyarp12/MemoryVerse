{% extends "base.html" %}

{% block extra_css %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/login.css') }}">
{% endblock %}

{% block content %}
<div class="auth-card">
  <div class="auth-avatar">🔑✨</div>
  <h2 class="auth-title">Reset Password</h2>
  <p style="color: var(--text-muted); margin-bottom: 24px;">Enter your email to set a new password 🌸</p>

  <form method="POST" action="{{ url_for('forgot_password') }}">
    <div class="form-group">
      <label class="form-label">Registered Email</label>
      <input type="email" name="email" class="form-input" placeholder="shreya@example.com" required>
    </div>

    <div class="form-group">
      <label class="form-label">New Password</label>
      <input type="password" name="new_password" class="form-input" placeholder="••••••••" required>
    </div>

    <div class="form-group">
      <label class="form-label">Confirm New Password</label>
      <input type="password" name="confirm_password" class="form-input" placeholder="••••••••" required>
    </div>

    <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 10px;">Reset Password 💖</button>
  </form>

  <p style="margin-top: 24px; font-size: 0.9rem;">
    Remembered your password? <a href="{{ url_for('login') }}" style="color: #D63384; font-weight: 700;">Back to Login</a> 🌸
  </p>
</div>
{% endblock %}
