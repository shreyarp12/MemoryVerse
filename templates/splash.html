{% extends "base.html" %}

{% block extra_css %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/splash.css') }}">
{% endblock %}

{% block content %}
<div class="splash-wrapper">
  <img src="{{ url_for('static', filename='images/logo.png') }}" alt="MemoryVerse" style="width: 80px; height: 80px; object-fit: contain; margin-bottom: 12px;">
  <h1 class="splash-title">MemoryVerse</h1>
  <p class="splash-tagline">"Capture Today, Treasure Tomorrow" 🎀</p>
  <div class="loading-bar"></div>
</div>
{% endblock %}

{% block extra_js %}
<script>
  setTimeout(() => {
    window.location.href = "{{ url_for('login') }}";
  }, 2200);
</script>
{% endblock %}
