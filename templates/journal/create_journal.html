{% extends "base.html" %}

{% block content %}
<div class="card" style="max-width: 600px; margin: 0 auto;">
  <h2 style="font-size: 1.5rem; font-weight: 800; color: #D63384; margin-bottom: 16px;">Write New Memory 🌸</h2>
  
  <form method="POST" enctype="multipart/form-data">
    <div style="margin-bottom: 14px;">
      <label style="display: block; font-weight: 700; margin-bottom: 4px;">Title</label>
      <input type="text" name="title" required placeholder="Great Day at College ✨" style="width: 100%; padding: 10px; border-radius: var(--radius-md); border: 1.5px solid #EEE6FF;">
    </div>

    <div style="margin-bottom: 14px;">
      <label style="display: block; font-weight: 700; margin-bottom: 4px;">Vibe / Mood</label>
      <select name="mood" style="width: 100%; padding: 10px; border-radius: var(--radius-md); border: 1.5px solid #EEE6FF;">
        <option value="😊">😊 Happy</option>
        <option value="🥰">🥰 Loved</option>
        <option value="😍">😍 Excited</option>
        <option value="😐">😐 Okay</option>
        <option value="😔">😔 Low</option>
        <option value="😴">😴 Tired</option>
      </select>
    </div>

    <div style="margin-bottom: 14px;">
      <label style="display: block; font-weight: 700; margin-bottom: 4px;">Content</label>
      <textarea id="journalContent" name="content" rows="6" required placeholder="Write down everything you're feeling today..." style="width: 100%; padding: 10px; border-radius: var(--radius-md); border: 1.5px solid #EEE6FF; font-family: inherit;"></textarea>
      <div id="wordCount" style="font-size: 0.8rem; color: var(--text-muted); text-align: right; margin-top: 4px;">0 words ✨</div>
    </div>

    <div style="margin-bottom: 14px;">
      <label style="display: block; font-weight: 700; margin-bottom: 4px;">Attach Photo (Optional)</label>
      <input type="file" name="photo" accept="image/*">
    </div>

    <div style="display: flex; gap: 20px; margin-bottom: 20px;">
      <label><input type="checkbox" name="favorite" value="1"> ⭐ Mark Favorite</label>
      <label><input type="checkbox" name="locked" value="1"> 🔒 Lock Memory</label>
    </div>

    <button type="submit" class="btn btn-primary" style="width: 100%;">Save Memory 💖</button>
  </form>
</div>
{% endblock %}

{% block extra_js %}
<script src="{{ url_for('static', filename='js/journal.js') }}"></script>
{% endblock %}
