{% extends "base.html" %}

{% block content %}
<div class="card" style="max-width: 600px; margin: 0 auto;">
  <h2 style="font-size: 1.5rem; font-weight: 800; color: #D63384; margin-bottom: 16px;">Edit Memory 📝</h2>
  
  <form method="POST" enctype="multipart/form-data">
    <div style="margin-bottom: 14px;">
      <label style="display: block; font-weight: 700; margin-bottom: 4px;">Title</label>
      <input type="text" name="title" value="{{ journal.title }}" required style="width: 100%; padding: 10px; border-radius: var(--radius-md); border: 1.5px solid #EEE6FF;">
    </div>

    <div style="margin-bottom: 14px;">
      <label style="display: block; font-weight: 700; margin-bottom: 4px;">Mood</label>
      <select name="mood" style="width: 100%; padding: 10px; border-radius: var(--radius-md); border: 1.5px solid #EEE6FF;">
        <option value="😊" {% if journal.mood == '😊' %}selected{% endif %}>😊 Happy</option>
        <option value="🥰" {% if journal.mood == '🥰' %}selected{% endif %}>🥰 Loved</option>
        <option value="😍" {% if journal.mood == '😍' %}selected{% endif %}>😍 Excited</option>
        <option value="😐" {% if journal.mood == '😐' %}selected{% endif %}>😐 Okay</option>
        <option value="😔" {% if journal.mood == '😔' %}selected{% endif %}>😔 Low</option>
        <option value="😴" {% if journal.mood == '😴' %}selected{% endif %}>😴 Tired</option>
      </select>
    </div>

    <div style="margin-bottom: 14px;">
      <label style="display: block; font-weight: 700; margin-bottom: 4px;">Content</label>
      <textarea name="content" rows="6" required style="width: 100%; padding: 10px; border-radius: var(--radius-md); border: 1.5px solid #EEE6FF; font-family: inherit;">{{ journal.content }}</textarea>
    </div>

    <div style="margin-bottom: 14px;">
      <label style="display: block; font-weight: 700; margin-bottom: 4px;">Update Photo</label>
      <input type="file" name="photo" accept="image/*">
    </div>

    <div style="display: flex; gap: 20px; margin-bottom: 20px;">
      <label><input type="checkbox" name="favorite" value="1" {% if journal.favorite %}checked{% endif %}> ⭐ Favorite</label>
      <label><input type="checkbox" name="locked" value="1" {% if journal.locked %}checked{% endif %}> 🔒 Locked</label>
    </div>

    <button type="submit" class="btn btn-primary" style="width: 100%;">Update Memory ✨</button>
  </form>
</div>
{% endblock %}
