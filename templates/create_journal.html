{% extends "base.html" %}

{% block css %}
<link rel="stylesheet"
href="{{ url_for('static', filename='css/create_journal.css') }}">
{% endblock %}

{% block content %}

<div class="journal-page">

    <!-- Header -->

    <div class="top-bar">

        <a href="/journal" class="back-btn">

            ←

        </a>

        <h2>New Journal</h2>

        <button
            type="submit"
            form="journalForm"
            class="save-top">

            Save

        </button>

    </div>

    <!-- Form -->

    <form
        id="journalForm"
        method="POST"
        enctype="multipart/form-data">

        <!-- Title -->

        <div class="card">

            <label>

                Journal Title

            </label>

            <input
                type="text"
                name="title"
                placeholder="My Beautiful Day..."
                required>

        </div>

        <!-- Content -->

        <div class="card">

            <label>

                Your Memory

            </label>

            <textarea
                name="content"
                rows="8"
                placeholder="Write today's memories..."
                required></textarea>

        </div>

        <!-- Photos -->

        <div class="card">

            <label>

                Add Photos

            </label>

            <input
                type="file"
                name="photo"
                multiple>

            <div
                id="previewImages"
                class="preview-grid">

            </div>

        </div>

        <!-- Stickers -->

        <div class="card">

            <label>

                Stickers

            </label>

            <button
                type="button"
                class="sticker-btn"
                onclick="openStickerPopup()">

                🌸 Choose Sticker

            </button>

            <div
                id="selectedSticker"
                class="selected-sticker">

            </div>

            <input
                type="hidden"
                id="stickerInput"
                name="sticker">

        </div>

        <!-- Favourite -->

        <div class="option-box">

            <label>

                <input
                    type="checkbox"
                    name="favorite">

                ⭐ Favourite Journal

            </label>

        </div>

        <!-- Lock -->

        <div class="option-box">

            <label>

                <input
                    type="checkbox"
                    id="lockToggle"
                    onchange="showPinBox()">

                🔒 Lock Journal

            </label>

        </div>

        <!-- PIN -->

        <div
            id="pinBox"
            style="display:none;">

            <input
                type="password"
                maxlength="4"
                minlength="4"
                name="pin"
                placeholder="Enter 4 Digit PIN">

        </div>

        <!-- Save -->

        <button
            class="save-btn"
            type="submit">

            💚 Save Journal

        </button>

    </form>

</div>

<!-- Sticker Popup -->

<div
id="stickerPopup"
class="sticker-popup">

    <div class="popup-box">

        <div class="popup-header">

            <h2>

                Choose Sticker

            </h2>

            <button
            onclick="closeStickerPopup()">

                ✖

            </button>

        </div>

        <!-- Categories -->

        <div class="category-tabs">

            <button
            onclick="showCategory('animals')"
            type="button">

                🐻

            </button>

            <button
            onclick="showCategory('flowers')"
            type="button">

                🌸

            </button>

            <button
            onclick="showCategory('aesthetic')"
            type="button">

                ✨

            </button>

            <button
            onclick="showCategory('food')"
            type="button">

                🍰

            </button>

            <button
            onclick="showCategory('study')"
            type="button">

                📚

            </button>

            <button
            onclick="showCategory('travel')"
            type="button">

                ✈️

            </button>

            <button
            onclick="showCategory('emotions')"
            type="button">

                😊

            </button>

        </div>

        <!-- Search -->

        <input
        id="searchSticker"
        type="text"
        placeholder="Search Sticker...">

        <!-- Sticker Grid -->

        <div
        id="stickerContainer"
        class="sticker-grid">

        </div>

    </div>

</div>

{% endblock %}

{% block js %}
<script src="{{ url_for('static', filename='js/create_journal.js') }}"></script>
{% endblock %}
