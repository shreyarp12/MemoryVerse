{% extends "base.html" %}

{% block extra_css %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/login.css') }}">
{% endblock %}

{% block content %}
<div class="auth-card">
  <div class="auth-avatar">🐰🎀</div>
  <h2 class="auth-title">Welcome Back</h2>
  <p style="color: var(--text-muted); margin-bottom: 24px;">Sign into your digital memory box ✨</p>

  <form method="POST" action="{{ url_for('login') }}">
    <div class="form-group">
      <label class="form-label">Email Address</label>
      <input type="email" name="email" class="form-input" placeholder="shreya@example.com" required>
    </div>

    <div class="form-group">
      <label class="form-label">Password</label>
      <div class="password-wrap">
        <input type="password" id="password" name="password" class="form-input" placeholder="••••••••" required>
        <span class="toggle-pwd" onclick="togglePassword()">👁️</span>
      </div>
    </div>

    <div style="text-align: right; margin-bottom: 16px;">
      <a href="{{ url_for('forgot_password') }}" style="font-size: 0.8rem; color: #D63384; font-weight: 600;">Forgot Password? 🔑</a>
    </div>

    <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 4px;">Sign In 🌸</button>
  </form>

  <p style="margin-top: 24px; font-size: 0.9rem;">
    New here? <a href="{{ url_for('signup') }}" style="color: #D63384; font-weight: 700;">Create an account</a> 💖
  </p>
</div>
{% endblock %}

{% block extra_js %}
<script src="{{ url_for('static', filename='js/login.js') }}"></script>
{% endblock %}
