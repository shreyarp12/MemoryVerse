{% extends "base.html" %}

{% block css %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/login.css') }}">
{% endblock %}

{% block content %}

<div class="login-container">

    <div class="login-card">

        <h1>Welcome Back 🌸</h1>

        <p class="subtitle">
            Login to continue your journey
        </p>

        <form method="POST">

            <input
                type="email"
                name="email"
                placeholder="Email Address"
                required
            >

            <input
                type="password"
                id="password"
                name="password"
                placeholder="Password"
                required
            >

            <button
                type="button"
                class="show-password"
                onclick="togglePassword()">

                👁 Show / Hide Password

            </button>

            <button
                type="submit"
                class="login-btn">

                Login

            </button>

        </form>

        <a class="forgot-password" href="#">
            Forgot Password?
        </a>

        <p class="signup-link">

            Don't have an account?

            <a href="/signup">
                Sign Up
            </a>

        </p>

    </div>

</div>

{% endblock %}

{% block js %}
<script src="{{ url_for('static', filename='js/login.js') }}"></script>
{% endblock %}
